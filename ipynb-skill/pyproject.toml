[project]
name = "ipynb-tool"
version = "0.2.0"
description = "Inspect and safely edit Jupyter notebooks from the command line."
requires-python = ">=3.9"
dependencies = [
    "jupytext>=1.18,<2",
    "nbformat>=5.10,<6",
]

[project.scripts]
ipynb-tool = "ipynb_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
